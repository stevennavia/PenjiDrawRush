<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Penji Draw Rush</title>
    <meta name="description" content="Draw, jump, and create your way through a magical Christmas adventure.">
    <link rel="canonical" href="https://penjidrawrush.vercel.app/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://penjidrawrush.vercel.app/">
    <meta property="og:site_name" content="Penji Draw Rush">
    <meta property="og:title" content="Penji Draw Rush">
    <meta property="og:description" content="Draw, jump, and create your way through a magical Christmas adventure.">
    <meta property="og:image" content="https://penjidrawrush.vercel.app/assets/draw-rush-splash-en.png">
    <meta property="og:image:secure_url" content="https://penjidrawrush.vercel.app/assets/draw-rush-splash-en.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1792">
    <meta property="og:image:height" content="1024">
    <meta property="og:image:alt" content="Penji Draw Rush — Draw your way through Christmas">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Penji Draw Rush">
    <meta name="twitter:description" content="Draw, jump, and create your way through a magical Christmas adventure.">
    <meta name="twitter:image" content="https://penjidrawrush.vercel.app/assets/draw-rush-splash-en.png">
    <link rel="stylesheet" href="style.css?v=leaderboard-1">
  </head>
  <body>
    <main>
      <audio id="bgm" src="assets/sleight-of-snow.mp3" preload="auto" loop autoplay muted playsinline></audio>
      <aside id="desktopHints" aria-label="Game controls">
        <span><b>SPACEBAR</b> · JUMP</span>
        <span><b>MOUSE</b> · DRAW</span>
      </aside>
      <canvas id="game" aria-label="Penji Draw Rush"></canvas>
      <section id="start" class="splash">
        <button id="play" aria-label="Play Penji Draw Rush"></button>
      </section>
      <div id="hud" hidden>
        <div id="lives">♥ ♥ ♥</div>
        <div class="ink"><span>💧 INK <strong id="inkValue">100/100</strong></span><i><em id="ink"></em></i></div>
        <div class="score"><b id="stage">CREATIVE OFFICE</b><span id="meters">BUILD MODE</span></div>
      </div>
      <div id="tools" hidden></div>
      <button id="jump" hidden aria-label="Jump">↑</button>
      <button id="pause" hidden aria-label="Pause">Ⅱ</button>
      <div id="notice" aria-live="polite"></div>
      <section id="over" class="panel" hidden aria-live="polite">
        <p class="eyebrow">THE RUN IS OVER</p>
        <h2>GAME OVER</h2>
        <div id="score"></div>
        <form id="scoreForm" novalidate>
          <label for="playerName">SAVE YOUR SCORE</label>
          <div class="scoreEntry">
            <input id="playerName" name="playerName" type="text" minlength="2" maxlength="16" pattern="[A-Za-z0-9 _-]+" autocomplete="nickname" placeholder="YOUR NAME" required>
            <button id="saveScore" type="submit">SAVE</button>
          </div>
          <p id="saveStatus" role="status"></p>
        </form>
        <section class="leaderboard" aria-labelledby="leaderboardTitle">
          <h3 id="leaderboardTitle">GLOBAL TOP 10</h3>
          <ol id="leaderboardList"><li class="empty">Loading scores…</li></ol>
        </section>
        <button id="again">RETRY</button>
      </section>
    </main>
    <script type="module" src="game.js?v=leaderboard-1"></script>
  </body>
</html>
